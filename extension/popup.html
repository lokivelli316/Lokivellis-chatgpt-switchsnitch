<!doctype html><meta charset="utf-8"><title>SwitchSnitch</title>
<style>body{font:16px system-ui;background:#080808;color:#fff;min-width:310px;padding:14px}button,select,input{font:inherit;width:100%;box-sizing:border-box;padding:10px;margin:6px 0}#status,#health{font-weight:700}.bad{color:#ff8b8b}.ok{color:#9cff9c}</style>
<h2>SwitchSnitch</h2><label>Expected model</label>
<select id="expected"><option>GPT-5.6 Sol</option><option>GPT-6.2 Sol</option><option>UNLOCKED</option></select>
<button id="saveExpected">SET EXPECTED</button>
<label>Bridge token (run <code>snitch-token</code> in Termux)</label><input id="token" type="password" autocomplete="off">
<button id="saveToken">PROVISION TOKEN</button><button id="rotateToken">ROTATE TOKEN</button><button id="expirePending">EXPIRE MY PENDING EVENT</button><button id="clearToken">CLEAR LOCAL TOKEN</button>
<div id="status"></div><div id="health"></div><script src="popup.js"></script>
