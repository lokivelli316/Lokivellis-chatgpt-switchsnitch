name: native-android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ] || [ ! -d "$sdk/build-tools/35.0.0" ]; then
            manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$manager"
            "$manager" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$sdk/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle -p android :app:assembleDebug
      - name: Publish debug APK for operator testing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="native-debug-${GITHUB_SHA:0:12}"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/SwitchSnitch-native-debug.apk
          (cd release && sha256sum SwitchSnitch-native-debug.apk > SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/SwitchSnitch-native-debug.apk release/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" release/SwitchSnitch-native-debug.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Native Android debug ${GITHUB_SHA:0:12}" --notes "Debug-signed test build. S24 runtime acceptance and backend model identity are unverified."
          fi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SwitchSnitch-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
